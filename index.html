<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07070a">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brainrot">
  <meta name="description" content="BRAINROT STUDIO — studio de création de vidéos.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>BRAINROT STUDIO</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <main id="app" class="app" tabindex="-1" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Navigation principale">
    <a href="#/accueil" class="tab" data-route="accueil">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Accueil</span>
    </a>
    <a href="#/projets" class="tab" data-route="projets">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Projets</span>
    </a>
    <button type="button" class="tab tab-create" data-action="create" aria-label="Créer une vidéo">
      <span class="tab-create-disc">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </span>
      <span>Créer</span>
    </button>
    <a href="#/personnages" class="tab" data-route="personnages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <span>Personnages</span>
    </a>
    <a href="#/histoires" class="tab" data-route="histoires">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>
      <span>Histoires</span>
    </a>
  </nav>

  <dialog id="create-sheet" class="sheet" aria-labelledby="create-title">
    <form id="create-form" class="sheet-body" novalidate>
      <div class="sheet-grabber" aria-hidden="true"></div>
      <h2 id="create-title" class="sheet-title">Nouveau projet vidéo</h2>
      <p class="sheet-text">Donne un nom à ta vidéo. Le projet est enregistré comme brouillon dans « Projets en cours ».</p>
      <label class="field">
        <span class="field-label">Titre de la vidéo</span>
        <input id="create-input" name="title" type="text" maxlength="80" autocomplete="off" enterkeyhint="done" placeholder="Ex. : Le chat qui voulait devenir roi" required>
        <span class="field-error" id="create-error" role="alert"></span>
      </label>
      <p class="sheet-note">
        <span class="badge badge-soon">À venir</span>
        Les étapes de production (script, personnages, voix, montage) seront ajoutées dans les prochaines versions.
      </p>
      <div class="sheet-actions">
        <button type="button" class="btn btn-ghost" data-action="close-sheet">Annuler</button>
        <button type="submit" class="btn btn-primary">Créer le projet</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/store.js"></script>
  <script src="js/story-data.js"></script>
  <script src="js/story-gen.js"></script>
  <script src="js/character-prompt.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
